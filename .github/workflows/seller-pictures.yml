# ADR-162: downloads the thumbnails of Regency boards and worktops into public/sellers/regency/ (cropped, at most
# 512 px) and pushes a branch with them, opening a pull request when Actions may. Started by hand
# (Actions › Seller pictures › Run workflow); nothing is pushed to main directly.
name: Seller pictures

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  pictures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      # Thumbnails of boards and worktops not yet in the app (ADR-162).
      - run: node tools/sellers/regency-pictures.ts download src/core/sellers/regency.json .pictures-new public/sellers/regency

      # Keep the bottom-left 68 % (drops the seller's badge in the top-right corner), at most 512 px, then file them.
      - name: Crop and resize the new pictures
        run: |
          mkdir -p public/sellers/regency
          command -v mogrify >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q imagemagick; }
          if [ -d .pictures-new ] && [ -n "$(ls -A .pictures-new)" ]; then
            mogrify -gravity SouthWest -crop 68%x68%+0+0 +repage -resize '512x512>' -quality 82 -strip .pictures-new/*
            mv .pictures-new/* public/sellers/regency/
          fi

      - run: node tools/sellers/regency-pictures.ts mark src/core/sellers/regency.json public/sellers/regency

      # GitHub Actions may not be allowed to open pull requests here: the branch is pushed either way.
      - name: Push a branch with the pictures and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard public/sellers)" ]; then
            echo "No new pictures."
            exit 0
          fi
          branch="seller-pictures-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add public/sellers src/core/sellers/regency.json
          git commit -m "ADR-162: Regency board pictures ($(ls public/sellers/regency | wc -l) files, $(du -sh public/sellers/regency | cut -f1))"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "ADR-162: Regency board pictures" \
            --body "Board and worktop thumbnails downloaded, cropped and resized by the Seller pictures workflow (run ${{ github.run_id }}), and \`h: 1\` marked in \`src/core/sellers/regency.json\` for each picture saved." \
            || echo "::notice::Pushed $branch; open its pull request by hand (Actions may not create pull requests here)."
