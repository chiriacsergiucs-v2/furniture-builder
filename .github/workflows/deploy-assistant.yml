name: Deploy assistant function
# Deploys supabase/functions/assistant (ADR-239) when a push to main changes it. Needs two repository secrets:
# SUPABASE_ACCESS_TOKEN (a Supabase personal access token) and SUPABASE_PROJECT_REF (the project's reference id).
# Without either, the run prints a notice and passes; nothing is deployed. ANTHROPIC_API_KEY stays a Supabase secret.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/assistant/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-assistant
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF is not set; the assistant function was not deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v6
      - if: steps.secrets.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: steps.secrets.outputs.ready == 'true'
        run: supabase functions deploy assistant --project-ref "$SUPABASE_PROJECT_REF"
