name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Accounts (ADR-126, ADR-127): the Supabase project URL and its publishable (anon) key, public by design. The
      # repository's Actions variables win when set. Never a secret or service key here (ADR-131).
      - run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://nllwhcxvcbtjfkdhsyse.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'sb_publishable_jnuJfAkWljedvgaXtG-lVg_8FbXCFRC' }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # v5 runs on Node 24 and backs off while polling. Pages can stay at "updating_pages" for more than the default
      # 10 minutes when GitHub is slow (2026-11-05, run 42070761861), so wait up to 30 minutes before cancelling.
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
